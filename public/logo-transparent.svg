  <circle cx="256" cy="256" r="240" fill="none" stroke="#915eff" stroke-width="8" opacity="0.3"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#00ffff" stroke-width="4" opacity="0.5"/>
  
  <!-- Iniciais LB estilizadas -->
