<!DOCTYPE html>
<html>
  <head>
    <title>DOOM</title>
    <script type="text/javascript">
      function loadDoomGame(canvas) {
        let moduleInstanceMemory = null;
        let ctx = canvas.getContext('2d');
        let scratchSpaceImageData = null;

        function onGameInit(width, height) {
          canvas.width = width;
          canvas.height = height;
          scratchSpaceImageData = ctx.createImageData(width, height);
        }

        function drawFrame(indexOfFrameBuffer) {
          let doomFrameBuffer = new Uint8Array(
            moduleInstanceMemory.buffer,
            indexOfFrameBuffer,
            canvas.width * canvas.height * 4
          );

          for (var i = 0; i < scratchSpaceImageData.data.length / 4; i++) {
            scratchSpaceImageData.data[4 * i + 0] = doomFrameBuffer[4 * i + 2];
            scratchSpaceImageData.data[4 * i + 1] = doomFrameBuffer[4 * i + 1];
            scratchSpaceImageData.data[4 * i + 2] = doomFrameBuffer[4 * i + 0];
            scratchSpaceImageData.data[4 * i + 3] = 255;
          }

          ctx.putImageData(scratchSpaceImageData, 0, 0);
        }

        function timeInMilliseconds() {
          return BigInt(Math.trunc(performance.now()));
        }

        function onInfoMessage(messagePtr, length) {
          const message = readModuleMemoryAsUtf8String(
            moduleInstanceMemory,
            messagePtr,
            length
          );
          console.log('[Doom] ' + message);
        }

        function onErrorMessage(messagePtr, length) {
          const message = readModuleMemoryAsUtf8String(
            moduleInstanceMemory,
            messagePtr,
            length
          );
          console.error('[Doom] ' + message);
        }

        let imports = {
          loading: {
            onGameInit: onGameInit,
            wadSizes: function () {},
            readWads: function () {},
          },
          ui: {
            drawFrame: drawFrame,
          },
          runtimeControl: {
            timeInMilliseconds: timeInMilliseconds,
          },
          console: {
            onInfoMessage: onInfoMessage,
            onErrorMessage: onErrorMessage,
          },
          gameSaving: {
            sizeOfSaveGame: function () {
              return 0;
            },
            readSaveGame: function () {
              return 0;
            },
            writeSaveGame: function () {
              return 0;
            },
          },
        };

        WebAssembly.instantiateStreaming(fetch('doom.wasm'), imports).then(
          function (result) {
            let exports = result.instance.exports;
            moduleInstanceMemory = exports.memory;

            var doomKeyFromJavascriptKey = new Map([
              ['ArrowLeft', exports.KEY_LEFTARROW],
              ['ArrowRight', exports.KEY_RIGHTARROW],
              ['ArrowUp', exports.KEY_UPARROW],
              ['ArrowDown', exports.KEY_DOWNARROW],
              [',', exports.KEY_STRAFE_L],
              ['.', exports.KEY_STRAFE_R],
              ['Control', exports.KEY_FIRE],
              [' ', exports.KEY_USE],
              ['Shift', exports.KEY_SHIFT],
              ['Tab', exports.KEY_TAB],
              ['Escape', exports.KEY_ESCAPE],
              ['Enter', exports.KEY_ENTER],
              ['Backspace', exports.KEY_BACKSPACE],
              ['Alt', exports.KEY_ALT],
            ]);

            function convertKeyEventToDoomKey(javaScriptKeyEvent) {
              var correspondingDoomKey = null;
              if (doomKeyFromJavascriptKey.has(javaScriptKeyEvent.key)) {
                correspondingDoomKey = doomKeyFromJavascriptKey.get(
                  javaScriptKeyEvent.key
                );
              } else if (javaScriptKeyEvent.key.length == 1) {
                correspondingDoomKey =
                  javaScriptKeyEvent.key.charCodeAt(0);
              }

              if (correspondingDoomKey !== null) {
                javaScriptKeyEvent.stopPropagation();
                javaScriptKeyEvent.preventDefault();
              }

              return correspondingDoomKey;
            }

            canvas.addEventListener('keydown', function (event) {
              var doomKey = convertKeyEventToDoomKey(event);
              if (doomKey !== null) {
                exports.reportKeyDown(doomKey);
              }
            });
            canvas.addEventListener('keyup', function (event) {
              var doomKey = convertKeyEventToDoomKey(event);
              if (doomKey !== null) {
                exports.reportKeyUp(doomKey);
              }
            });

            exports.initGame();
            setInterval(exports.tickGame, 1000 / 35);
          }
        );
      }

      function readModuleMemoryAsUtf8String(
        moduleMemory,
        offsetIntoMemory,
        stringByteLength
      ) {
        var buffer8 = new Uint8Array(moduleMemory.buffer);
        var dec = new TextDecoder('utf-8', { fatal: false });
        var data = buffer8.slice(
          offsetIntoMemory,
          offsetIntoMemory + stringByteLength
        );
        return dec.decode(data);
      }

      addEventListener('load', function () {
        var canvas = document.getElementById('DoomGame');
        loadDoomGame(canvas);
      });
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      canvas#DoomGame {
        display: block;
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        outline: none;
      }
      canvas#DoomGame:not(:focus) {
        filter: brightness(0.7);
      }
    </style>
  </head>
  <body>
    <canvas id="DoomGame" tabindex="0"></canvas>
    <script>
      addEventListener('load', function () {
        document.getElementById('DoomGame').focus();
      });
      document.addEventListener('click', function () {
        document.getElementById('DoomGame').focus();
      });
    </script>
  </body>
</html>
