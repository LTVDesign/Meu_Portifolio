<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="/manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- LCP Optimization: Preload da imagem LCP com alta prioridade -->
  <link rel="preload" href="/assets/icons/logo.webp" as="image" type="image/webp" fetchpriority="high">
  <link rel="preload" href="/assets/images/pc-gamer.webp" as="image" type="image/webp" fetchpriority="high">

  <!-- Pré-conexão para Vercel e APIs externas para reduzir latência -->
  <link rel="preconnect" href="https://portifoliolele.vercel.app" crossorigin>
  <link rel="preconnect" href="https://api.emailjs.com" crossorigin>
  <link rel="dns-prefetch" href="https://portifoliolele.vercel.app">
  <link rel="dns-prefetch" href="https://api.emailjs.com">

  <!-- Preload do modelo 3D imediato para reduzir LCP -->
  <link rel="preload" href="/desktop_pc/scene-optimized.gltf" as="fetch" type="model/gltf" crossorigin>

  <!-- CSP (Content Security Policy) -->
  <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'wasm-unsafe-eval' data: https://cdn.jsdelivr.net https://unpkg.com https://va.vercel-scripts.com https://cdnjs.cloudflare.com;
  style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com;
  img-src 'self' data: https:;
  font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com;
  connect-src 'self' https://api.emailjs.com ws://localhost:5174 ws://localhost:5173 https://va.vercel-scripts.com;
  frame-src 'self';
  object-src 'none';
  base-uri 'self';
  form-action 'self';
  manifest-src 'self' https://vercel.com;
 ">

  <!-- Google Fonts: Inter — Async load to prevent render blocking -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" media="print" id="fonts-async">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet">
  </noscript>

  <link rel="canonical" href="https://leandrobarbosa.dev">
  <meta name="description"
    content="Leandro Barbosa: De Infraestrutura a Inteligência Artificial — Desenvolvedor Full Stack especializado em React, Node.js, Three.js e aplicações web modernas de alto desempenho.">
  <meta name="keywords"
    content="desenvolvedor, full stack, react, node.js, three.js, portfólio, 3d, web development, inteligência artificial, javascript, typescript">
  <meta name="author" content="Leandro Barbosa">
  <meta property="og:title" content="Leandro Barbosa: De Infraestrutura a Inteligência Artificial">
  <meta property="og:description"
    content="Leandro Barbosa: De Infraestrutura a Inteligência Artificial — Desenvolvedor Full Stack especializado em React, Node.js, Three.js e aplicações web modernas de alto desempenho.">
  <meta property="og:image" content="https://portifoliolele.vercel.app/logo.webp">
  <meta property="og:url" content="https://leandrobarbosa.dev">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Leandro Barbosa: De Infraestrutura a Inteligência Artificial">
  <meta name="twitter:description"
    content="Leandro Barbosa: De Infraestrutura a Inteligência Artificial — Desenvolvedor Full Stack">
  <meta name="twitter:image" content="https://portifoliolele.vercel.app/logo.webp">
  <title>Leandro Saturnino Barbosa | Portfólio 3D - React & Three.js</title>
  <link rel="icon" type="image/png" sizes="196x196" href="/favicon-196.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
</head>

      <div class="skeleton-box"></div>
    </div>
