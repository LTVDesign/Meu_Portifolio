<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="content-type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <meta name="description" content="Play DOOM via JS-DOS.">
  <meta name="keywords" content="DOOM,pc,game,javscript">
  <title>Play DOOM via JS-DOS</title>

  <!-- CSS -->
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- FAVICON -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="manifest" href="site.webmanifest">

  <!-- JS-DOS API - usando arquivo local -->
  <script type="text/javascript" src="js-dos-api.js"></script>

  <style>
    body {
      background-color: #121212;
      color: white;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    #DOOM>.dosbox-container {
      width: 640px;
      height: 400px;
    }

    #DOOM>.dosbox-container>.dosbox-overlay {
      background: url("DOOM.png");
      background-size: cover;
    }

    #DOOM>.dosbox-container>.dosbox-overlay>.dosbox-start {
      border-radius: 17px 17px 17px 17px;
      -moz-border-radius: 17px 17px 17px 17px;
      -webkit-border-radius: 17px 17px 17px 17px;
      border: 0px solid #000000;
      background-color: rgba(90, 90, 90, 0.57);
      padding: 5px;
      text-align: center;
      vertical-align: middle;
      width: 10em;
      margin: 0 auto;
    }

    a:link {
      color: white;
    }

    h1 {
      margin-top: 20px;
      margin-bottom: 10px;
    }

    footer {
      margin-bottom: 10px;
      font-size: 12px;
      color: #888;
    }

    .controls {
      margin-top: 15px;
      text-align: center;
    }

    .controls a {
      color: white;
      text-decoration: none;
      padding: 10px;
    }

    .controls a:hover {
      color: #268bd2;
    }
  </style>
</head>

<body>
  <h1>Play DOOM via JS-DOS</h1>
  <footer>©TheDoggyBrad Software Lab. All Rights Reserved.</footer>

  <div style="margin-top:20px;" id="DOOM" class="dosbox-default"></div>

  <div class="controls">
    <a id="fullscreen_DOOM" href="javascript: void 0;" class="fa-solid fa-expand"></a>&nbsp;&nbsp;
    <a href="https://github.com/thedoggybrad/doom_on_js-dos/blob/main/MANUAL.MD" target="_blank">
      <i class="fa-solid fa-book"></i>&nbsp;&nbsp;User Manual
    </a>
  </div>

  <script type="text/javascript">
    var dosbox_DOOM = new Dosbox({
      id: "DOOM",
      onload: function (dosbox) {
        // Usando arquivo ZIP local
        dosbox_DOOM.run("DOOM-@evilution.zip", "./DOOM/DOOM.EXE");
      },
      onrun: function (dosbox, app) {
        console.log("App '" + app + "' is running");
      }
    });

    document.getElementById("fullscreen_DOOM").addEventListener("click", function () {
      dosbox_DOOM.requestFullScreen();
    });
  </script>
</body>

</html>
