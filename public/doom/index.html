<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>DOOM</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        background: #000;
        overflow: hidden;
      }
      #doom {
        position: absolute;
        margin: auto;
        z-index: 1;
        width: 133.33vh;
        height: 100vh;
        opacity: 0;
        transition: opacity 1s 0.5s;
        left: 0; top: 0; right: 0; bottom: 0;
        image-rendering: pixelated;
      }
      #doom.ready { opacity: 1; }
      #loader {
        position: absolute;
        line-height: 32px;
        text-align: center;
        height: 30px;
        width: 300px;
        margin: auto;
        bottom: 0; right: 0; left: 0; top: 0;
        color: #00CC00;
        font-family: monospace;
        font-size: 30px;
        transition: opacity 0.5s;
      }
      #loader.completed { pointer-events: none; opacity: 0; }
      #loader span { display: inline-block; }
      #fullscreen {
        transition: opacity 1s 0.5s;
        background-color: #000;
        border: solid 1px #00CC00;
        color: #00CC00;
        text-transform: uppercase;
        font-family: monospace;
        font-size: 16px;
        letter-spacing: 2px;
        padding: 6px 20px;
        cursor: pointer;
        position: absolute;
        bottom: 20px;
        right: 20px;
        z-index: 10;
        opacity: 0;
        pointer-events: all;
      }
      #fullscreen.visible { opacity: 1; }
      #fullscreen:hover { background-color: #00CC00; color: #000; }
    </style>
  </head>
  <body>
    <canvas id="doom"></canvas>
    <div id="loader">
      <span>Loading DOOM...</span>
      <span id="progress">0.0%</span>
    </div>
    <button id="fullscreen">Fullscreen</button>
    <script>
      'use strict';

      window.Module = {
        monitorRunDependencies: function(toLoad) {
          this.dependencies = Math.max(this.dependencies, toLoad);
        },
        dependencies: 0,
        setStatus: null,
        progress: null,
        loader: null,
        canvas: null
      };

      function getStatus(status) {
        var loading = status.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        if (loading) {
          var progress = loading[2] / loading[4] * 100;
          Module.progress.innerHTML = progress.toFixed(1) + '%';
          if (progress === 100) {
            setTimeout(function() {
              document.getElementById('fullscreen').classList.add('visible');
              Module.loader.classList.add('completed');
              Module.canvas.classList.add('ready');
            }, 500);
            setTimeout(function() {
              Module.canvas.dispatchEvent(new Event('mousedown'));
            }, 2000);
          }
        }
      }

      window.addEventListener('DOMContentLoaded', function() {
        Module.progress = document.getElementById('progress');
        Module.loader = document.getElementById('loader');
        Module.canvas = document.getElementById('doom');
        Module.setStatus = getStatus;

        Module.canvas.addEventListener('webglcontextlost', function(event) {
          alert('WebGL context lost. Please reload the page.');
          event.preventDefault();
        }, false);

        Module.canvas.addEventListener('contextmenu', function(event) {
          event.preventDefault();
        });

        document.getElementById('fullscreen').addEventListener('click', function() {
          Module.requestFullscreen(true, false);
        });

        var doomScript = document.createElement('script');
        doomScript.type = 'text/javascript';
        doomScript.src = 'doom1.js';
        document.body.appendChild(doomScript);
      });
    </script>
  </body>
</html>
